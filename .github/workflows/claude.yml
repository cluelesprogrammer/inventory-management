name: Claude

# Runs Claude on @claude mentions in issues, PR comments, and PR reviews.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: [self-hosted]   # Needs a self-hosted runner on the PwC network. See PR description.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      # Gateway URL and API key come from GitHub secrets, so the internal host is never committed.
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_MODEL: vertex_ai.anthropic.claude-haiku-5-5
      ANTHROPIC_DEFAULT_OPUS_MODEL: bedrock.anthropic.claude-opus-5-5
      ANTHROPIC_DEFAULT_SONNET_MODEL: bedrock.anthropic.claude-sonnet-5-5
      ANTHROPIC_DEFAULT_HAIKU_MODEL: vertex_ai.anthropic.claude-haiku-5-5
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
